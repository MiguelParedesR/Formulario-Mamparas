<link rel="stylesheet" href="../../CSS/apple-system.css" />

<main class="app-layout">
  <div class="app-layout-inner">
    <header class="tpp-topbar">
      <div class="tpp-title-group">
        <p class="tpp-eyebrow">Mamparas · Histórico</p>
        <h1 class="tpp-page-title">Registros de inspección</h1>
        <p class="tpp-page-subtitle">
          Consulta unidades inspeccionadas, filtra por placa y revisa medidas y evidencias en alta visibilidad.
        </p>
      </div>

      <div class="tpp-field" style="width:min(340px,100%)">
        <label for="buscarPlaca">Buscar placa</label>
        <input id="buscarPlaca" type="search" placeholder="Ej. ABC123" autocomplete="off"
          maxlength="6" style="text-transform:uppercase;letter-spacing:.06em" />
      </div>
    </header>

    <div id="mamparasRecordsStatus" class="form-status" role="status" aria-live="polite"></div>

    <section class="table-shell">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Empresa</th>
            <th>Placa</th>
            <th>Chofer</th>
            <th>Lugar</th>
            <th>Incorrección</th>
            <th>Responsable</th>
            <th>Detalle</th>
          </tr>
        </thead>
        <tbody id="tabla-registros"></tbody>
      </table>
    </section>
  </div>

  <div id="mampara-detalle-modal-container"></div>

  <script type="module" src="../../js/mamparas/registros.js"></script>
  <script type="module" src="../../js/mamparas/detalle-modal.js"></script>
</main>

<link rel="stylesheet" href="../../CSS/apple-redesign.css" />

<main class="v3-records">
  <div class="v3-filterbar">
    <div class="search-group">
      <label for="buscarPlaca">Buscar</label>
      <input type="search" id="buscarPlaca" placeholder="Placa" maxlength="12" autocomplete="off" />
    </div>
  </div>

  <div class="v3-table-wrap">
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Empresa</th>
          <th>Placa</th>
          <th>Chofer</th>
          <th>Lugar</th>
          <th>Incorrección</th>
          <th>Responsable</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-registros"></tbody>
    </table>
  </div>

  <div id="mampara-detalle-modal-container"></div>

  <script type="module" src="../../js/mamparas/registros.js"></script>
  <script type="module" src="../../js/mamparas/detalle-modal.js"></script>
</main>

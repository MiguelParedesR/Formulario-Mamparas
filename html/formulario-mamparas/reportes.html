<link rel="stylesheet" href="../../CSS/apple-redesign.css" />

<main class="mamparas-root mamparas-modern">
  <div class="mamparas-header">
    <div>
      <p class="section-kicker">Mamparas</p>
      <h1>Reportes</h1>
      <p>Genera el formato corporativo F-OPESEG-045 por período y operador, con feedback visible de carga, vacío, éxito o error.</p>
    </div>
  </div>

  <section class="mamparas-form-surface">
    <div class="mamparas-form-section">
      <h2>Parámetros de exportación</h2>
      <div class="mamparas-fields">
        <div>
          <label for="mes">Mes</label>
          <input type="month" id="mes" />
          <p class="helper">Se consultarán únicamente registros dentro del mes seleccionado.</p>
        </div>
        <div>
          <label for="operador">Operador</label>
          <select id="operador">
            <option value="Todos">Todos (sin filtro)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="mamparas-form-section">
      <div id="reportStatus" class="hidden rounded-xl border px-4 py-3 text-sm" role="alert" aria-live="assertive"></div>
      <div class="flex flex-wrap items-center gap-3">
        <button id="btnExportarExcel" type="button" class="apple-button primary">
          <i class="fas fa-download"></i>&nbsp; Generar Excel F-OPESEG-045
        </button>
        <span class="helper">La descarga conserva el formato corporativo histórico del módulo.</span>
      </div>
    </div>
  </section>
</main>

<div id="feedbackModal" class="modal-overlay hidden items-center justify-center z-[6000]">
  <div class="modal-card bg-white w-80 p-5 text-center">
    <div id="loadingAnimation" class="mx-auto h-9 w-9 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
    <p id="feedbackMessage" class="message text-sm font-medium" style="margin-top:12px"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script type="module" src="../../js/mamparas/reportes.js"></script>
